openapi: 3.0.3
info:
  title: Опора API
  version: 1.0.0
  description: Официальный каталог, импортированный индекс ФНС и обезличенное объяснение.
    API не подает заявки и не принимает решения о финансировании.
servers:
- url: http://localhost:3002
  description: Локальный API
- url: http://localhost:3000
  description: Frontend proxy / Docker
paths:
  /api/health:
    get:
      summary: Работоспособность API
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                    - ok
                  service:
                    type: string
                    enum:
                    - opora
                  catalog:
                    type: string
                    enum:
                    - official
                  privacy:
                    type: string
                required:
                - status
                - service
                - catalog
                - privacy
        '429':
          description: Лимит запросов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Внутренняя ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/providers/status:
    get:
      summary: Готовность официальных источников и AI
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderStatus'
        '429':
          description: Лимит запросов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Внутренняя ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/funding/catalog:
    get:
      summary: Проверенный снимок официального каталога
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                type: object
                properties:
                  mode:
                    type: string
                    enum:
                    - official
                  opportunities:
                    type: array
                    items:
                      $ref: '#/components/schemas/FundingOpportunity'
                required:
                - mode
                - opportunities
        '429':
          description: Лимит запросов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Внутренняя ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/funding/status:
    get:
      summary: Состав и версия официального снимка
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FundingStatus'
        '429':
          description: Лимит запросов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Внутренняя ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/ai/status:
    get:
      summary: Настройка AI и последняя проверка соединения
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIStatus'
        '429':
          description: Лимит запросов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Внутренняя ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/company/{inn}:
    get:
      summary: Поиск по ИНН в импортированном индексе ФНС
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyResponse'
        '400':
          description: Некорректный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Не найдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Лимит запросов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: Источник недоступен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Источник не настроен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: inn
        in: path
        required: true
        schema:
          type: string
          pattern: ^(\d{10}|\d{12})$
        description: Контрольные цифры проверяются сервером; отсутствие индекса —
          503.
  /api/funding/match:
    post:
      summary: Детерминированный подбор без LLM и без ИНН
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                profile:
                  $ref: '#/components/schemas/FundingProfile'
                need:
                  $ref: '#/components/schemas/FundingNeed'
                preparedDocuments:
                  type: object
                  additionalProperties:
                    type: array
                    items:
                      type: string
              required:
              - profile
              - need
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FundingResponse'
        '400':
          description: Некорректный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Лимит запросов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Внутренняя ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/assistant:
    post:
      summary: Объяснение результатов через GigaChat с privacy boundary
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                question:
                  type: string
                  minLength: 1
                  maxLength: 2000
                task:
                  type: string
                  enum:
                  - matching
                  - documents
                  - deadlines
                  - strategy
                  - draft
                  - why_fit
                  - why_not
                  - submit_now
                  - compare
                draftKind:
                  type: string
                  enum:
                  - project
                  - rationale
                  - cover
                context:
                  type: object
                  properties:
                    profile:
                      $ref: '#/components/schemas/FundingProfile'
                    need:
                      $ref: '#/components/schemas/FundingNeed'
                    programId:
                      type: string
                    application:
                      type: object
                      properties:
                        preparedDocuments:
                          type: array
                          items:
                            type: string
                        budget:
                          type: number
                          nullable: true
              required:
              - question
              - context
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                type: object
                properties:
                  answer:
                    type: string
                  mode:
                    type: string
                    enum:
                    - llm
                  provider:
                    type: string
                    enum:
                    - gigachat
                  opportunityIds:
                    type: array
                    description: IDs официальных программ из серверного контекста ответа; модель их не задаёт.
                    items:
                      type: string
                  privacy:
                    type: object
                    properties:
                      policy:
                        type: string
                        enum:
                        - strict-v1
                      protectedCount:
                        type: integer
                required:
                - answer
                - mode
                - provider
                - privacy
        '400':
          description: Некорректный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Лимит запросов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: Источник недоступен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Источник не настроен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/funding/calendar.ics:
    get:
      summary: Календарь опубликованных сроков для скачивания и MAX Bridge
      parameters:
        - in: query
          name: ids
          description: ID программ через запятую (до 50). Если не указан, возвращается весь каталог.
          schema:
            type: string
      responses:
        '400':
          description: Неизвестные ID программ или неверный формат
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: iCalendar RFC 5545
          content:
            text/calendar:
              schema:
                type: string
        '429':
          description: Лимит запросов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/ai/assist:
    post:
      summary: AI с контекстом, историей, источниками и проверяемыми предложениями
      description: Свободный текст сохраняет смысл после минимизации известных
        реквизитов. Не изменяет состояние пользователя. До 384 КБ JSON, 60 000
        символов документов и четырёх одновременных запросов. При недоступном
        провайдере возможен ответ 200 с mode=local.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AIContextRequest"
      responses:
        "200":
          description: AI-ответ или явно обозначенный расчёт по правилам
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AIContextResult"
        "400": &a1
          description: Ошибка запроса или провайдера
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429": *a1
        "502": *a1
  /api/funding/updates:
    get:
      summary: Состояние мониторинга официальных страниц и обнаруженные изменения
      responses:
        "200":
          description: События отражают изменения текста страницы; условия требуют сверки
          content:
            application/json:
              schema:
                type: object
                properties:
                  checkedAt:
                    type: string
                    nullable: true
                  pages:
                    type: integer
                  errors:
                    type: integer
                  updates:
                    type: array
                    items:
                      $ref: "#/components/schemas/AISourceUpdate"
                required:
                  - checkedAt
                  - pages
                  - errors
                  - updates
        "429": *a1
components:
  schemas:
    AIWorkspaceInput:
      type: object
      required: [savedIds, applications]
      properties:
        savedIds:
          type: array
          maxItems: 50
          items:
            type: string
        applications:
          type: array
          maxItems: 30
          items:
            type: object
            required: [programId]
            properties:
              programId:
                type: string
              project:
                type: string
                maxLength: 2000
              budget:
                type: integer
                nullable: true
                minimum: 0
                maximum: 1000000000000000
              preparedDocuments:
                type: array
                items:
                  type: string
              hasDraft:
                type: boolean
              reviewConfirmed:
                type: boolean
    AIWorkspaceInsight:
      type: object
      required: [title, text, action]
      properties:
        title:
          type: string
          maxLength: 60
        text:
          type: string
          maxLength: 300
        action:
          type: string
          enum: [programs, funding, applications, profile, assistant, calendar]
    AIPersonalization:
      type: object
      required: [summary, sections, priorities]
      properties:
        summary:
          type: string
          maxLength: 700
        sections:
          type: object
          required: [home, programs, applications, calendar, assistant]
          properties:
            home:
              $ref: '#/components/schemas/AIWorkspaceInsight'
            programs:
              $ref: '#/components/schemas/AIWorkspaceInsight'
            applications:
              $ref: '#/components/schemas/AIWorkspaceInsight'
            calendar:
              $ref: '#/components/schemas/AIWorkspaceInsight'
            assistant:
              $ref: '#/components/schemas/AIWorkspaceInsight'
        priorities:
          type: array
          maxItems: 6
          items:
            type: object
            required: [programId, reason]
            properties:
              programId:
                type: string
              reason:
                type: string
                maxLength: 300
    AIContextRequest:
      type: object
      properties:
        task:
          type: string
          enum:
            - chat
            - intake
            - search
            - analysis
            - strategy
            - review
            - draft
            - changes
            - workspace
        question:
          type: string
          maxLength: 2000
          minLength: 1
        history:
          type: array
          items:
            type: object
            properties:
              role:
                type: string
                enum:
                  - user
                  - assistant
              text:
                type: string
                maxLength: 12000
            required:
              - role
              - text
          maxItems: 20
        context:
          type: object
          properties:
            profile:
              $ref: "#/components/schemas/FundingProfile"
            need:
              $ref: "#/components/schemas/FundingNeed"
            programId:
              type: string
              maxLength: 100
            page:
              type: string
              maxLength: 40
            project:
              type: string
              maxLength: 10000
            budget:
              type: number
              nullable: true
              minimum: 0
              maximum: 1000000000000000
            draft:
              type: string
              maxLength: 18000
            draftKind:
              type: string
              maxLength: 100
            preparedDocuments:
              type: array
              items:
                type: string
                maxLength: 160
              maxItems: 30
            documents:
              type: array
              items:
                $ref: "#/components/schemas/AIDocument"
              maxItems: 8
            identifiers:
              type: object
              description: Известные реквизиты для удаления из свободного текста; не
                передаются провайдеру.
              additionalProperties:
                type: string
                maxLength: 500
            workspace:
              $ref: '#/components/schemas/AIWorkspaceInput'
      required:
        - task
        - question
        - context
    AIDocument:
      type: object
      properties:
        id:
          type: string
          maxLength: 60
          pattern: ^[\w-]+$
        name:
          type: string
          maxLength: 200
        pages:
          type: array
          items:
            type: object
            properties:
              page:
                type: integer
                minimum: 1
                maximum: 1000
              text:
                type: string
                maxLength: 40000
            required:
              - page
              - text
          maxItems: 40
      required:
        - id
        - pages
    AIEvidence:
      type: object
      properties:
        id:
          type: string
          maxLength: 160
        title:
          type: string
          maxLength: 200
        text:
          type: string
          maxLength: 20000
        url:
          type: string
          format: uri
        checkedAt:
          type: string
          maxLength: 30
        page:
          type: integer
        documentId:
          type: string
          maxLength: 60
        opportunityId:
          type: string
          maxLength: 100
      required:
        - id
        - title
        - text
    AIContextResult:
      type: object
      properties:
        personalization:
          $ref: '#/components/schemas/AIPersonalization'
        providerFailure:
          type: string
          description: Обезличенный код сбоя провайдера, без содержимого запроса или ответа.
        mode:
          type: string
          enum:
            - llm
            - local
        answer:
          type: string
          maxLength: 12000
        notice:
          type: string
          maxLength: 1000
        followups:
          type: array
          items:
            type: string
            maxLength: 300
          maxItems: 3
        citations:
          type: array
          items:
            $ref: "#/components/schemas/AIEvidence"
        actions:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
                enum:
                  - open_program
                  - prepare_application
                  - open_funding
              label:
                type: string
                maxLength: 300
              programId:
                type: string
                maxLength: 100
            required:
              - type
              - label
        proposedNeed:
          $ref: "#/components/schemas/FundingNeed"
        proposedProfile:
          $ref: "#/components/schemas/FundingProfile"
        draft:
          type: string
          maxLength: 18000
        findings:
          type: array
          items:
            type: object
            properties:
              title:
                type: string
                maxLength: 120
              detail:
                type: string
                maxLength: 1000
              severity:
                type: string
                enum:
                  - check
                  - warning
              evidenceId:
                type: string
                maxLength: 160
              quote:
                type: string
                maxLength: 800
            required:
              - title
              - detail
              - severity
          maxItems: 15
        matches:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                maxLength: 100
              title:
                type: string
                maxLength: 200
              status:
                type: string
                maxLength: 40
              score:
                type: number
              explanation:
                type: string
                maxLength: 5000
            required:
              - id
              - title
              - status
              - score
              - explanation
        scenarios:
          type: array
          items:
            type: object
            properties:
              label:
                type: string
                maxLength: 100
              need:
                $ref: "#/components/schemas/FundingNeed"
              matches:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      maxLength: 100
                    title:
                      type: string
                      maxLength: 200
                    status:
                      type: string
                      maxLength: 40
                    score:
                      type: number
                  required:
                    - id
                    - title
                    - status
                    - score
            required:
              - label
              - need
              - matches
          maxItems: 3
        tools:
          type: array
          items:
            type: string
            maxLength: 100
        usage:
          type: object
          properties:
            calls:
              type: integer
            tokens:
              type: integer
            durationMs:
              type: number
          required:
            - calls
            - tokens
            - durationMs
      required:
        - mode
        - answer
        - followups
        - citations
        - actions
        - findings
        - matches
        - scenarios
        - tools
    AISourceUpdate:
      type: object
      properties:
        id:
          type: string
          maxLength: 100
        url:
          type: string
          format: uri
        title:
          type: string
          maxLength: 200
        detectedAt:
          type: string
          format: date-time
        opportunityId:
          type: string
          maxLength: 100
        kind:
          type: string
          enum:
            - changed
            - discovered
      required:
        - id
        - url
        - title
        - detectedAt
        - kind
    Error:
      type: object
      properties:
        error:
          type: string
        code:
          type: string
      required:
      - error
      - code
    FundingNeed:
      type: object
      properties:
        purpose:
          type: string
          enum:
          - покупка оборудования
          - оборотные средства
          - разработка продукта
          - найм сотрудников
          - экспорт
          - аренда / недвижимость
          - сельхозтехника
          - запуск производства
          - масштабирование
        amount:
          type: number
          nullable: true
          minimum: 1
        ownFunds:
          type: number
          nullable: true
          minimum: 0
        preferredTermMonths:
          type: integer
          nullable: true
          minimum: 1
          maximum: 600
        needsCollateralSupport:
          type: boolean
          nullable: true
      required:
      - purpose
    FundingProfile:
      type: object
      properties:
        region:
          type: string
          maxLength: 120
        okved:
          type: string
        companyType:
          type: string
          enum:
          - ''
          - ООО
          - АО
          - ИП
          - КФХ
          - другое
        ageMonths:
          type: number
          nullable: true
          minimum: 0
        employees:
          type: number
          nullable: true
          minimum: 0
        revenue:
          type: number
          nullable: true
          minimum: 0
        isSme:
          type: string
          enum:
          - 'yes'
          - 'no'
          - unknown
        tax:
          type: string
        goals:
          type: array
          items:
            type: string
        applicantType:
          type: string
          enum:
          - legal_entity
          - individual_entrepreneur
          - individual
          - team
          - project
        companyStatus:
          type: string
          nullable: true
        industry:
          type: string
        stage:
          type: string
    FundingRequirement:
      type: object
      properties:
        field:
          type: string
        operator:
          type: string
          enum:
          - eq
          - neq
          - gte
          - lte
          - prefix
          - includes
        value:
          oneOf:
          - type: string
          - type: number
          - type: boolean
          - type: array
            items:
              type: string
        required:
          type: boolean
        label:
          type: string
      required:
      - field
      - operator
      - value
      - required
      - label
    FundingSource:
      type: object
      properties:
        name:
          type: string
        url:
          type: string
          format: uri
        type:
          type: string
          enum:
          - official
        updatedAt:
          type: string
          format: date
        verifiedAt:
          type: string
          format: date
      required:
      - name
      - url
      - type
      - updatedAt
      - verifiedAt
    FundingOpportunity:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        kind:
          type: string
        providerName:
          type: string
        providerType:
          type: string
        description:
          type: string
        version:
          type: string
        amountMin:
          type: number
          nullable: true
        amountMax:
          type: number
          nullable: true
        rateMin:
          type: number
          nullable: true
        rateMax:
          type: number
          nullable: true
        termMonthsMin:
          type: number
          nullable: true
        termMonthsMax:
          type: number
          nullable: true
        preparationDays:
          type: number
          nullable: true
        projectBudgetMin:
          type: number
          nullable: true
        cofinancingPercent:
          type: number
          nullable: true
        purposes:
          type: array
          items:
            type: string
        sectors:
          type: array
          items:
            type: string
        okvedPrefixes:
          type: array
          items:
            type: string
        companyTypes:
          type: array
          items:
            type: string
        applicantTypes:
          type: array
          items:
            type: string
        requiredDocuments:
          type: array
          items:
            type: string
        manualConditions:
          type: array
          items:
            type: string
        regions:
          oneOf:
          - type: string
            enum:
            - all
          - type: array
            items:
              type: string
        requirements:
          type: array
          items:
            $ref: '#/components/schemas/FundingRequirement'
        deadline:
          type: string
          format: date
          nullable: true
        status:
          type: string
          enum:
          - active
          - closed
          - upcoming
          - unknown
        difficulty:
          type: string
          enum:
          - low
          - medium
          - high
        source:
