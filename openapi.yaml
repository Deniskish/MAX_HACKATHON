          BotSignature: []
      responses:
        "200":
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationsState"
        "400":
          description: Некорректный JSON или данные запроса
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "401":
          description: MAX_AUTH_REQUIRED или BOT_AUTH_REQUIRED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "429":
          description: RATE_LIMITED или BOT_BUSY
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "500":
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "503":
          description: MAX_NOT_CONFIGURED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
      description: До 100 уведомлений текущего контекста подписки, новые первыми. monitor присутствует, если передан
        callback worker status (в production передан).
  /api/notifications/subscription:
    put:
      summary: Сохранить подписку на новые меры
      security:
        - MaxInitData: []
        - BotUser: []
          BotTime: []
          BotNonce: []
          BotSignature: []
      responses:
        "200":
          description: Успешный ответ
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled:
                    type: boolean
                    enum:
                      - true
                  bot:
                    type: boolean
                required:
                  - enabled
                  - bot
        "400":
          description: Некорректный JSON или данные запроса
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "401":
          description: MAX_AUTH_REQUIRED или BOT_AUTH_REQUIRED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "429":
          description: RATE_LIMITED или BOT_BUSY
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "500":
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "503":
          description: MAX_NOT_CONFIGURED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
      description: Требуются непустой регион и хотя бы одно из okved, industry, goals. Если need отсутствует или
        purpose пуст, используется «Все цели» с неизвестными суммами. bot — согласие на уведомления в MAX.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                profile:
                  allOf:
                    - $ref: "#/components/schemas/FundingProfile"
                    - required:
                        - region
                      anyOf:
                        - required:
                            - okved
                        - required:
                            - industry
                        - required:
                            - goals
                need:
                  type: object
                  nullable: true
                  description: Если purpose отсутствует или пуст, используется «Все цели» с неизвестными суммами.
                  properties:
                    purpose:
                      type: string
                    amount:
                      $ref: '#/components/schemas/FundingNeed/properties/amount'
                    ownFunds:
                      $ref: '#/components/schemas/FundingNeed/properties/ownFunds'
                    preferredTermMonths:
                      $ref: '#/components/schemas/FundingNeed/properties/preferredTermMonths'
                    needsCollateralSupport:
                      type: boolean
                      nullable: true
                bot:
                  type: boolean
              required:
                - profile
                - bot
    delete:
      summary: Удалить подписку и связанные уведомления
      security:
        - MaxInitData: []
        - BotUser: []
          BotTime: []
          BotNonce: []
          BotSignature: []
      responses:
        "200":
          description: Успешный ответ
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled:
                    type: boolean
                    enum:
                      - false
                required:
                  - enabled
        "400":
          description: Некорректный JSON или данные запроса
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "401":
          description: MAX_AUTH_REQUIRED или BOT_AUTH_REQUIRED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "429":
          description: RATE_LIMITED или BOT_BUSY
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "500":
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "503":
          description: MAX_NOT_CONFIGURED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
  /api/notifications/read:
    post:
      summary: Отметить уведомление прочитанным
      security:
        - MaxInitData: []
        - BotUser: []
          BotTime: []
          BotNonce: []
          BotSignature: []
      responses:
        "200":
          description: Успешный ответ
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                      - true
                required:
                  - ok
        "400":
          description: Bad Request при неверном поле; INVALID_INPUT при некорректном JSON.
          content:
            text/plain:
              schema:
                type: string
                enum:
                  - Bad Request
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: MAX_AUTH_REQUIRED или BOT_AUTH_REQUIRED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "429":
          description: RATE_LIMITED или BOT_BUSY
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "500":
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "503":
          description: MAX_NOT_CONFIGURED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
      description: Изменяет только уведомление текущего пользователя. Неизвестный или чужой id также возвращает
        ok=true без изменения чужих данных.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
              required:
                - id
  /api/bot/workspace:
    get:
      summary: Прочитать workspace чат-бота
      security:
        - BotUser: []
          BotTime: []
          BotNonce: []
          BotSignature: []
      description: Доступ только сервису бота с валидной подписью. Если записи нет, возвращаются data={} и revision=0.
      responses:
        "200":
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotWorkspace"
        "401":
          description: BOT_AUTH_REQUIRED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "429":
          description: RATE_LIMITED или BOT_BUSY
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "500":
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
    put:
      summary: Сохранить workspace чат-бота
      security:
        - BotUser: []
          BotTime: []
          BotNonce: []
          BotSignature: []
      description: JSON.stringify(data).length не более 80000 символов; тело JSON не более 256 КБ. revision —
        неотрицательное safe integer, должно совпадать с сохранённым. При успехе revision увеличивается.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BotWorkspace"
      responses:
        "200":
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotWorkspace"
        "400":
          description: INVALID_BOT_WORKSPACE или INVALID_INPUT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "401":
          description: BOT_AUTH_REQUIRED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "409":
          description: BOT_WORKSPACE_CONFLICT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "429":
          description: RATE_LIMITED или BOT_BUSY
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "500":
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
components:
  schemas:
    AIWorkspaceInput:
      type: object
      required: [savedIds, applications]
      properties:
        savedIds:
          type: array
          maxItems: 50
          items:
            type: string
        applications:
          type: array
          maxItems: 30
          items:
            type: object
            required: [programId]
            properties:
              programId:
                type: string
              project:
                type: string
                maxLength: 2000
              budget:
                type: integer
                nullable: true
                minimum: 0
                maximum: 1000000000000000
              preparedDocuments:
                type: array
                items:
                  type: string
              hasDraft:
                type: boolean
              reviewConfirmed:
                type: boolean
    AIWorkspaceInsight:
      type: object
      required: [title, text, action]
      properties:
        title:
          type: string
          maxLength: 60
        text:
          type: string
          maxLength: 300
        action:
          type: string
          enum: [programs, funding, applications, profile, assistant, calendar]
    AIPersonalization:
      type: object
      required: [summary, sections, priorities]
      properties:
        summary:
          type: string
          maxLength: 700
        sections:
          type: object
          required: [home, programs, applications, calendar, assistant]
          properties:
            home:
              $ref: '#/components/schemas/AIWorkspaceInsight'
            programs:
              $ref: '#/components/schemas/AIWorkspaceInsight'
            applications:
              $ref: '#/components/schemas/AIWorkspaceInsight'
            calendar:
              $ref: '#/components/schemas/AIWorkspaceInsight'
            assistant:
              $ref: '#/components/schemas/AIWorkspaceInsight'
        priorities:
          type: array
          maxItems: 6
          items:
            type: object
            required: [programId, reason]
            properties:
              programId:
                type: string
              reason:
                type: string
                maxLength: 300
    AIContextRequest:
      type: object
      properties:
        task:
          type: string
          enum:
            - chat
            - intake
            - search
            - analysis
            - strategy
            - review
            - draft
            - changes
            - workspace
        question:
          type: string
          maxLength: 2000
          minLength: 1
        history:
          type: array
          items:
            type: object
            properties:
              role:
                type: string
                enum:
                  - user
                  - assistant
              text:
                type: string
                maxLength: 12000
                minLength: 1
            required:
              - role
              - text
          maxItems: 20
        context:
          type: object
          properties:
            profile:
              $ref: "#/components/schemas/FundingProfile"
            need:
              $ref: "#/components/schemas/FundingNeed"
            programId:
              type: string
              maxLength: 100
            page:
              type: string
              maxLength: 40
            project:
              type: string
              maxLength: 10000
            budget:
              type: integer
              nullable: true
              minimum: 0
              maximum: 1000000000000000
            draft:
              type: string
              maxLength: 18000
            draftKind:
              type: string
              maxLength: 100
            preparedDocuments:
              type: array
              items:
                type: string
                maxLength: 160
              maxItems: 30
            documents:
              type: array
              items:
                $ref: "#/components/schemas/AIDocument"
              maxItems: 8
            identifiers:
              type: object
              description: Известные реквизиты для удаления из свободного текста; не
                передаются провайдеру.
              additionalProperties:
                type: string
                maxLength: 500
            workspace:
              $ref: '#/components/schemas/AIWorkspaceInput'
      required:
        - task
        - question
        - context
    AIDocument:
      type: object
      properties:
        id:
          type: string
          maxLength: 60
          pattern: ^[\w-]+$
          minLength: 1
        name:
          type: string
          maxLength: 200
        pages:
          type: array
          items:
            type: object
            properties:
              page:
                type: integer
                minimum: 1
                maximum: 1000
              text:
                type: string
                maxLength: 40000
            required:
              - page
          maxItems: 40
          minItems: 1
      required:
        - id
        - pages
    AIEvidence:
      type: object
      properties:
        id:
          type: string
          maxLength: 160
        title:
          type: string
        text:
          type: string
        url:
          type: string
          format: uri
        checkedAt:
          type: string
          maxLength: 30
        page:
          type: integer
        documentId:
          type: string
          maxLength: 60
        opportunityId:
          type: string
          maxLength: 100
      required:
        - id
        - title
        - text
    AIContextResult:
      type: object
      properties:
        personalization:
          $ref: '#/components/schemas/AIPersonalization'
        providerFailure:
          type: string
          description: Обезличенный код сбоя провайдера, без содержимого запроса или ответа.
        mode:
          type: string
          enum:
            - llm
            - local
        answer:
          type: string
        notice:
          type: string
          maxLength: 1000
        followups:
          type: array
          items:
            type: string
            maxLength: 300
          maxItems: 3
        citations:
          type: array
          items:
            $ref: "#/components/schemas/AIEvidence"
        actions:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
                enum:
                  - open_program
                  - prepare_application
                  - open_funding
              label:
                type: string
              programId:
                type: string
                maxLength: 100
            required:
              - type
              - label
        proposedNeed:
          $ref: "#/components/schemas/FundingNeed"
        proposedProfile:
          $ref: "#/components/schemas/FundingProfile"
        draft:
          type: string
          maxLength: 18000
        findings:
          type: array
          items:
            type: object
            properties:
              title:
                type: string
                maxLength: 120
              detail:
                type: string
                maxLength: 1000
              severity:
                type: string
                enum:
                  - check
                  - warning
              evidenceId:
                type: string
                maxLength: 160
              quote:
                type: string
                maxLength: 800
            required:
              - title
              - detail
              - severity
          maxItems: 15
        matches:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              title:
                type: string
              status:
                type: string
                maxLength: 40
              score:
                type: number
              explanation:
                type: string
            required:
              - id
              - title
              - status
              - score
              - explanation
        scenarios:
          type: array
          items:
            type: object
            properties:
              label:
                type: string
                maxLength: 100
              need:
                $ref: "#/components/schemas/FundingNeed"
              matches:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    title:
                      type: string
                    status:
                      type: string
                      maxLength: 40
                    score:
                      type: number
                  required:
                    - id
                    - title
                    - status
                    - score
            required:
              - label
              - need
              - matches
          maxItems: 3
        tools:
          type: array
          items:
            type: string
            maxLength: 100
        usage:
          type: object
          properties:
            calls:
              type: integer
            tokens:
              type: integer
            durationMs:
              type: number
          required:
            - calls
            - tokens
            - durationMs
      required:
        - mode
        - answer
        - followups
        - citations
        - actions
        - findings
        - matches
        - scenarios
        - tools
    AISourceUpdate:
      type: object
      properties:
        id:
          type: string
          maxLength: 100
        url:
          type: string
          format: uri
        title:
          type: string
          maxLength: 200
        detectedAt:
          type: string
          format: date-time
        opportunityId:
          type: string
          maxLength: 100
        kind:
          type: string
          enum:
            - changed
            - discovered
      required:
        - id
        - url
        - title
        - detectedAt
        - kind
    Error:
      type: object
      properties:
        error:
          type: string
        code:
          type: string
      required:
      - error
      - code
    FundingNeed:
      type: object
      properties:
        purpose:
          type: string
          description: Текущая категория цели. Старые значения и пустая строка принимаются для совместимости и нормализуются; пустая строка означает «Все цели».
          enum:
          - Все цели
          - Запуск или развитие бизнеса
          - Оборудование и модернизация
          - Оборотные расходы
          - Разработка продукта / технологии
          - Продажи, продвижение и экспорт
          - Персонал и обучение
          - Помещения и инфраструктура
          - ''
          - покупка оборудования
          - оборотные средства
          - разработка продукта
          - найм сотрудников
          - экспорт
          - аренда / недвижимость
          - сельхозтехника
          - запуск производства
          - масштабирование
        amount:
          description: Пустая строка принимается как неизвестное значение. В ответе возвращается число или null.
          oneOf:
            - type: integer
              nullable: true
              minimum: 1
              maximum: 1000000000000000
            - type: string
              enum:
                - ""
        ownFunds:
          description: Пустая строка принимается как неизвестное значение. В ответе возвращается число или null.
          oneOf:
            - type: integer
              nullable: true
              minimum: 0
              maximum: 1000000000000000
            - type: string
              enum:
                - ""
        preferredTermMonths:
          description: Пустая строка принимается как неизвестное значение. В ответе возвращается число или null.
          oneOf:
            - type: integer
              nullable: true
              minimum: 1
              maximum: 600
            - type: string
              enum:
                - ""
        needsCollateralSupport:
          type: boolean
          nullable: true
      required:
      - purpose
    FundingProfile:
      type: object
      properties:
        region:
          type: string
          maxLength: 120
          nullable: true
        okved:
          type: string
          maxLength: 120
          nullable: true
          pattern: ^(?:\d{2}(?:\.\d{1,2}){0,2})?$
        companyType:
          type: string
          enum:
          - ""
          - ООО
          - АО
          - ИП
          - КФХ
          - другое
          - null
          maxLength: 120
