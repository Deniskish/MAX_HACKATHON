  securitySchemes:
    MaxInitData:
      type: apiKey
      in: header
      name: X-Max-Init-Data
      description: Исходный подписанный MAX WebApp initData. Проверяются HMAC, auth_date (не старше 24 часов) и
        user.id. Пароль demo-экрана не является API-авторизацией.
    BotUser:
      type: apiKey
      in: header
      name: X-Opora-Bot-User
      description: MAX user id. Требуются одновременно BotTime, BotNonce и BotSignature; один user id не авторизует запрос.
    BotTime:
      type: apiKey
      in: header
      name: X-Opora-Bot-Time
      description: 13 цифр, Unix milliseconds, отклонение от серверного времени менее 60 секунд.
    BotNonce:
      type: apiKey
      in: header
      name: X-Opora-Bot-Nonce
      description: 36 символов [a-f0-9-], одноразовое значение; повтор отклоняется.
    BotSignature:
      type: apiKey
      in: header
      name: X-Opora-Bot-Signature
      description: HMAC-SHA256, 64 hex-символа. Формируется только серверным chatbot по протоколу
