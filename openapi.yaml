openapi: 3.0.3
info:
  title: Опора API
  version: 1.0.0
  description: Официальный каталог, импортированный индекс ФНС и обезличенное объяснение.
    API не подает заявки и не принимает решения о финансировании.
servers:
- url: https://business-opora.ru
  description: Production
- url: http://localhost:3002
  description: Локальный API
- url: http://localhost:3000
  description: Frontend proxy / Docker
paths:
  /api/health:
    get:
      summary: Работоспособность API
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                    - ok
                  service:
                    type: string
                    enum:
                    - opora
                  catalog:
                    type: string
                    enum:
                    - official
                  privacy:
                    type: string
                    enum:
                      - context-v2
                  revision:
                    type: string
                    nullable: true
                  legacyPrivacy:
                    type: string
                    enum:
                      - strict-v1
                required:
                - status
                - service
                - catalog
                - privacy
                - revision
                - legacyPrivacy
        '429':
          description: RATE_LIMITED или BOT_BUSY
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        '500':
          description: Внутренняя ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          description: BOT_AUTH_REQUIRED — только если передан некорректный X-Opora-Bot-User/подпись. Без bot-заголовков
            публичный маршрут не требует авторизации.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
  /api/providers/status:
    get:
      summary: Готовность официальных источников и AI
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderStatus'
        '429':
          description: RATE_LIMITED или BOT_BUSY
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        '500':
          description: Внутренняя ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          description: BOT_AUTH_REQUIRED — только если передан некорректный X-Opora-Bot-User/подпись. Без bot-заголовков
            публичный маршрут не требует авторизации.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
  /api/funding/catalog:
    get:
      summary: Проверенный снимок официального каталога
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                type: object
                properties:
                  mode:
                    type: string
                    enum:
                    - official
                  opportunities:
                    type: array
                    items:
                      $ref: '#/components/schemas/FundingOpportunity'
                required:
                - mode
                - opportunities
        '429':
          description: RATE_LIMITED или BOT_BUSY
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        '500':
          description: Внутренняя ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          description: BOT_AUTH_REQUIRED — только если передан некорректный X-Opora-Bot-User/подпись. Без bot-заголовков
            публичный маршрут не требует авторизации.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
  /api/funding/status:
    get:
      summary: Состав и версия официального снимка
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FundingStatus'
        '429':
          description: RATE_LIMITED или BOT_BUSY
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        '500':
          description: Внутренняя ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          description: BOT_AUTH_REQUIRED — только если передан некорректный X-Opora-Bot-User/подпись. Без bot-заголовков
            публичный маршрут не требует авторизации.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
  /api/ai/status:
    get:
      summary: Настройка AI и последняя проверка соединения
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIStatus'
        '429':
          description: RATE_LIMITED или BOT_BUSY
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        '500':
          description: Внутренняя ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          description: BOT_AUTH_REQUIRED — только если передан некорректный X-Opora-Bot-User/подпись. Без bot-заголовков
            публичный маршрут не требует авторизации.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
  /api/company/{inn}:
    get:
      summary: Поиск компании по ИНН через DaData или импортированный индекс ФНС
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyResponse'
        '400':
          description: Некорректный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Не найдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: RATE_LIMITED или BOT_BUSY
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        '502':
          description: Источник недоступен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Источник не настроен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          description: BOT_AUTH_REQUIRED — только если передан некорректный X-Opora-Bot-User/подпись. Без bot-заголовков
            публичный маршрут не требует авторизации.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "500":
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
      parameters:
      - name: inn
        in: path
        required: true
        schema:
          type: string
          pattern: ^(\d{10}|\d{12})$
        description: Контрольные цифры проверяются сервером. Источник выбирается конфигурацией; недоступный или
          ненастроенный источник возвращает 503.
  /api/funding/match:
    post:
      summary: Детерминированный подбор без LLM и без ИНН
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                profile:
                  $ref: '#/components/schemas/FundingProfile'
                need:
                  $ref: '#/components/schemas/FundingNeed'
                preparedDocuments:
                  type: object
                  additionalProperties:
                    type: array
                    maxItems: 30
                    items:
                      type: string
                      maxLength: 200
              required:
              - profile
              - need
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FundingResponse'
        '400':
          description: Некорректный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: RATE_LIMITED или BOT_BUSY
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        '500':
          description: Внутренняя ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          description: BOT_AUTH_REQUIRED — только если передан некорректный X-Opora-Bot-User/подпись. Без bot-заголовков
            публичный маршрут не требует авторизации.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
  /api/assistant:
    post:
      summary: Объяснение результатов через GigaChat с privacy boundary
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                question:
                  type: string
                  minLength: 1
                  maxLength: 2000
                task:
                  type: string
                  enum:
                  - matching
                  - documents
                  - deadlines
                  - strategy
                  - draft
                  - why_fit
                  - why_not
                  - submit_now
                  - compare
                draftKind:
                  type: string
                  enum:
                  - project
                  - rationale
                  - cover
                context:
                  type: object
                  properties:
                    profile:
                      $ref: '#/components/schemas/FundingProfile'
                    need:
                      $ref: '#/components/schemas/FundingNeed'
                    programId:
                      type: string
                    application:
                      type: object
                      properties:
                        preparedDocuments:
                          type: array
                          items:
                            type: string
                        budget:
                          type: number
                          nullable: true
                    applications:
                      type: array
                      description: Сохранённые заявки; учитываются только ID из серверного каталога.
                      items:
                        type: object
                        properties:
                          programId:
                            type: string
                          preparedDocuments:
                            type: array
                            items:
                              type: string
                          budget:
                            type: number
                            nullable: true
              required:
              - question
              - context
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                type: object
                properties:
                  answer:
                    type: string
                  mode:
                    type: string
                    enum:
                    - llm
                  provider:
                    type: string
                    enum:
                    - gigachat
                  opportunityIds:
                    type: array
                    description: IDs официальных программ из серверного контекста ответа; модель их не задаёт.
                    items:
                      type: string
                  privacy:
                    type: object
                    properties:
                      policy:
                        type: string
                        enum:
                        - strict-v1
                      protectedCount:
                        type: integer
                    required:
                      - policy
                      - protectedCount
                required:
                - answer
                - mode
                - provider
                - privacy
                - opportunityIds
        '400':
          description: Некорректный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: RATE_LIMITED или BOT_BUSY
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        '502':
          description: Источник недоступен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Источник не настроен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          description: BOT_AUTH_REQUIRED — только если передан некорректный X-Opora-Bot-User/подпись. Без bot-заголовков
            публичный маршрут не требует авторизации.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "500":
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
      description: Совместимый маршрут strict-v1. При отсутствии GigaChat возвращает 503; не выполняет подачу заявки.
  /api/funding/calendar.ics:
    get:
      summary: Календарь опубликованных сроков для скачивания и MAX Bridge
      parameters:
        - in: query
          name: ids
          description: ID программ через запятую (до 50). Если не указан, возвращается весь каталог.
          schema:
            type: string
      responses:
        '400':
          description: Неизвестные ID программ или неверный формат
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: iCalendar RFC 5545
          content:
            text/calendar:
              schema:
                type: string
        '429':
          description: RATE_LIMITED или BOT_BUSY
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "401":
          description: BOT_AUTH_REQUIRED — только если передан некорректный X-Opora-Bot-User/подпись. Без bot-заголовков
            публичный маршрут не требует авторизации.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "500":
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
  /api/ai/assist:
    post:
      summary: AI с контекстом, историей, источниками и проверяемыми предложениями
      description: Свободный текст сохраняет смысл после минимизации известных
        реквизитов. Не изменяет состояние пользователя. До 384 КБ JSON, 60 000
        символов документов и четырёх одновременных запросов. При недоступном
        провайдере возможен ответ 200 с mode=local.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AIContextRequest"
      responses:
        "200":
          description: AI-ответ или явно обозначенный расчёт по правилам
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AIContextResult"
        "400": &a1
          description: Ошибка запроса или провайдера
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429": {"description":"RATE_LIMITED или BOT_BUSY","content":{"application/json":{"schema":{"$ref":"#/components/schemas/APIError"}}}}
        "502": {"description":"Ошибка запроса или провайдера","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}}
        "401":
          description: BOT_AUTH_REQUIRED — только если передан некорректный X-Opora-Bot-User/подпись. Без bot-заголовков
            публичный маршрут не требует авторизации.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "500":
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
  /api/funding/updates:
    get:
      summary: Состояние мониторинга официальных страниц и обнаруженные изменения
      responses:
        "200":
          description: События отражают изменения текста страницы; условия требуют сверки
          content:
            application/json:
              schema:
                type: object
                properties:
                  checkedAt:
                    type: string
                    nullable: true
                  pages:
                    type: integer
                  errors:
                    type: integer
                  updates:
                    type: array
                    items:
                      $ref: "#/components/schemas/AISourceUpdate"
                required:
                  - checkedAt
                  - pages
                  - errors
                  - updates
        "429": {"description":"RATE_LIMITED или BOT_BUSY","content":{"application/json":{"schema":{"$ref":"#/components/schemas/APIError"}}}}
        "401":
          description: BOT_AUTH_REQUIRED — только если передан некорректный X-Opora-Bot-User/подпись. Без bot-заголовков
            публичный маршрут не требует авторизации.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "500":
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
  /api/funding/live-status:
    get:
      summary: Состояние импорта каталога Электронного бюджета
      description: Подключён в production с LiveCatalog. Не означает подтверждение условий каждой программы.
      responses:
        "200":
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveFundingStatus"
        "429":
          description: RATE_LIMITED или BOT_BUSY
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "500":
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
  /api/funding/interest:
    post:
      summary: Учесть интерес к региону для загрузки официальных источников
      description: Не создаёт заявку и не меняет критерии matching. Доступен при подключённом LiveCatalog.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                region:
                  type: string
                  maxLength: 100
              required:
                - region
      responses:
        "204":
          description: Интерес учтён; тело ответа отсутствует.
        "400":
          description: Bad Request при неверном поле; INVALID_INPUT при некорректном JSON.
          content:
            text/plain:
              schema:
                type: string
                enum:
                  - Bad Request
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: RATE_LIMITED или BOT_BUSY
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "500":
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
  /api/account:
    get:
      summary: Аккаунт пользователя MAX
      security:
        - MaxInitData: []
        - BotUser: []
          BotTime: []
          BotNonce: []
          BotSignature: []
      responses:
        "200":
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountState"
        "400":
          description: Некорректный JSON или данные запроса
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "401":
          description: MAX_AUTH_REQUIRED или BOT_AUTH_REQUIRED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "429":
          description: RATE_LIMITED или BOT_BUSY
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "500":
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "503":
          description: MAX_NOT_CONFIGURED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
      description: При первом обращении создаёт локальную запись аккаунта. MAX identity не подтверждает полномочия
        действовать от имени компании.
  /api/account/company:
    put:
      summary: Сохранить компанию в аккаунте
      security:
        - MaxInitData: []
        - BotUser: []
          BotTime: []
          BotNonce: []
          BotSignature: []
      responses:
        "200":
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountState"
        "400":
          description: Некорректный JSON или данные запроса
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "401":
          description: MAX_AUTH_REQUIRED или BOT_AUTH_REQUIRED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "409":
          description: ACCOUNT_CONFLICT — профиль изменён на другом устройстве.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "429":
          description: RATE_LIMITED или BOT_BUSY
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "500":
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "503":
          description: MAX_NOT_CONFIGURED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
      description: ИНН проверяется по контрольным цифрам; название, регион и основной ОКВЭД обязательны. revision
        должен совпадать с текущим значением аккаунта.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                company:
                  type: object
                  nullable: false
                  description: Сохранённые публичные факты. null означает отсутствие компании; реквизиты полномочий не
                    сохраняются.
                  properties:
                    region:
                      type: string
                      minLength: 1
                      maxLength: 120
                    okved:
                      type: string
                      pattern: ^\d{2}(\.\d{1,2}){0,2}$
                      maxLength: 120
                    companyType:
                      type: string
                      enum:
                        - ""
                        - ООО
                        - АО
                        - ИП
                        - КФХ
                        - другое
                        - null
                      maxLength: 120
                      nullable: true
                    ageMonths:
                      description: Пустая строка принимается как неизвестное значение. В ответе возвращается число или null.
                      oneOf:
                        - type: integer
                          nullable: true
                          minimum: 0
                          maximum: 3000
                        - type: string
                          enum:
                            - ""
                    employees:
                      description: Пустая строка принимается как неизвестное значение. В ответе возвращается число или null.
                      oneOf:
                        - type: integer
                          nullable: true
                          minimum: 0
                          maximum: 10000000
                        - type: string
                          enum:
                            - ""
                    revenue:
                      description: Пустая строка принимается как неизвестное значение. В ответе возвращается число или null.
                      oneOf:
                        - type: integer
                          nullable: true
                          minimum: 0
                          maximum: 1000000000000000
                        - type: string
                          enum:
                            - ""
                    isSme:
                      type: string
                      enum:
                        - "yes"
                        - "no"
                        - unknown
                        - null
                      maxLength: 120
                      nullable: true
                    tax:
                      type: string
                      maxLength: 120
                      nullable: true
                    goals:
                      type: array
                      items:
                        type: string
                        maxLength: 120
                      maxItems: 20
                      nullable: true
                    applicantType:
                      type: string
                      enum:
                        - legal_entity
                        - individual_entrepreneur
                        - individual
                        - team
                        - project
                    companyStatus:
                      type: string
                      nullable: true
                      maxLength: 120
                    industry:
                      type: string
                      maxLength: 120
                      nullable: true
                    stage:
                      type: string
                      maxLength: 120
                      nullable: true
                    inn:
                      type: string
                      pattern: ^(\d{10}|\d{12})$
                    name:
                      type: string
                      minLength: 1
                      maxLength: 120
                  required:
                    - inn
                    - name
                    - region
                    - okved
                revision:
                  type: integer
                  minimum: 0
              required:
                - company
                - revision
    delete:
      summary: Удалить компанию из аккаунта
      security:
        - MaxInitData: []
        - BotUser: []
          BotTime: []
          BotNonce: []
          BotSignature: []
      responses:
        "200":
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountState"
        "400":
          description: Некорректный JSON или данные запроса
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "401":
          description: MAX_AUTH_REQUIRED или BOT_AUTH_REQUIRED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "429":
          description: RATE_LIMITED или BOT_BUSY
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "500":
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "503":
          description: MAX_NOT_CONFIGURED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
      description: Удаляет компанию, подписку и связанные уведомления; очищает bot workspace. Возвращает аккаунт с
        company=null и увеличенной revision.
  /api/account/verification/esia:
