      responses:
        "400":
          description: Некорректный JSON или данные запроса
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "401":
          description: MAX_AUTH_REQUIRED или BOT_AUTH_REQUIRED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "429":
          description: RATE_LIMITED или BOT_BUSY
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "500":
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "503":
          description: ESIA_NOT_CONFIGURED либо MAX_NOT_CONFIGURED
