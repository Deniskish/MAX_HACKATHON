name: Render scenario report
on:
  workflow_dispatch:
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated document renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice-writer poppler-utils fonts-dejavu fonts-liberation
          python -m pip install pdf2image pillow
      - name: Render all report pages
        run: python .github/scripts/render_docx.py "Сценарии и результаты тестирования Опоры.docx" --output_dir report-render --emit_pdf
      - uses: actions/upload-artifact@v4
        with:
          name: report-render
          path: report-render
          retention-days: 7
