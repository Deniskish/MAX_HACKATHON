name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opora-production-deploy
  cancel-in-progress: false
  queue: max

jobs:
  ux:
    uses: ./.github/workflows/ux-check.yml
  deploy:
    needs: ux
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Prepare SSH and backend secrets
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY_B64: ${{ secrets.SERVER_SSH_KEY_B64 }}
          DADATA_API_KEY: ${{ secrets.DADATA_API_KEY }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$SERVER_HOST" && test -n "$SERVER_USER" && test -n "$SERVER_SSH_KEY_B64"
          install -d -m 700 ~/.ssh
          printf '%s' "$SERVER_SSH_KEY_B64" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -T 10 -H "$SERVER_HOST" >> ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host opora-production
            HostName $SERVER_HOST
            User $SERVER_USER
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 15
            ServerAliveInterval 15
            ServerAliveCountMax 4
          EOF
          chmod 600 ~/.ssh/config
          ssh opora-production 'mkdir -p /opt/opora-deploy; chmod 700 /opt/opora-deploy'
          if [ -n "$DADATA_API_KEY" ]; then
            printf 'DADATA_API_KEY=%s\n' "$DADATA_API_KEY" | ssh opora-production 'umask 077; cat > /opt/app/.env.dadata.new; mv /opt/app/.env.dadata.new /opt/app/.env.dadata'
          fi
          if [ -n "$BOT_TOKEN" ]; then
            printf 'BOT_TOKEN=%s\n' "$BOT_TOKEN" | ssh opora-production 'umask 077; cat > /opt/app/.env.bot.new; mv /opt/app/.env.bot.new /opt/app/.env.bot'
          fi
          scp ops/deploy.cjs opora-production:/opt/opora-deploy/deploy.cjs

      - name: Build, test and deploy exact commit with rollback
        id: release
        run: |
          set +e
          ssh opora-production "flock -w 900 /opt/opora-deploy/deploy.lock node /opt/opora-deploy/deploy.cjs /opt/app $GITHUB_SHA"
          code=$?
          set -e
          if [ "$code" = 3 ]; then
            echo 'deployed=false' >> "$GITHUB_OUTPUT"
            echo 'A newer commit is already installed; this outdated run was skipped.' >> "$GITHUB_STEP_SUMMARY"
          elif [ "$code" = 0 ]; then
            echo 'deployed=true' >> "$GITHUB_OUTPUT"
          else
            exit "$code"
          fi

      - name: Verify public HTTPS and release revision
        id: public
        if: steps.release.outputs.deployed == 'true'
        env:
          FRONTEND_URL: https://business-opora.ru
          EXPECTED_RELEASE_SHA: ${{ github.sha }}
        run: node miniapp/scripts/check-production.cjs

      # Integration outcomes remain visible without undoing a healthy installation.
      - name: Check company autofill
        id: company
        if: steps.release.outputs.deployed == 'true'
        continue-on-error: true
        run: ssh opora-production 'cd /opt/app; timeout 60 node miniapp/api-server/company-data/smoke-check.cjs'

      - name: Check all nine AI tasks and guest chat
        id: ai
        if: steps.release.outputs.deployed == 'true'
        continue-on-error: true
        run: |
          ssh opora-production 'cd /opt/app; timeout 850 node miniapp/api-server/ai/smoke-check.cjs'

      - name: Check MAX bot authorization without sending messages
        id: max
        if: steps.release.outputs.deployed == 'true'
        continue-on-error: true
        run: ssh opora-production 'cd /opt/app; OPORA_FUNDING_CHECK=bot timeout 60 node miniapp/api-server/funding-catalog/smoke-check.cjs'

      - name: Check live funding source and AI matching
        id: funding
        if: steps.release.outputs.deployed == 'true'
        continue-on-error: true
        run: ssh opora-production 'cd /opt/app; OPORA_FUNDING_CHECK=catalog timeout 180 node miniapp/api-server/funding-catalog/smoke-check.cjs'

      - name: Deployment summary
        if: always()
        env:
          RELEASE: ${{ steps.release.outcome }}
          DEPLOYED: ${{ steps.release.outputs.deployed }}
          PUBLIC: ${{ steps.public.outcome }}
          COMPANY: ${{ steps.company.outcome }}
          AI: ${{ steps.ai.outcome }}
          MAX: ${{ steps.max.outcome }}
          FUNDING: ${{ steps.funding.outcome }}
        run: |
          {
            echo "Commit: $GITHUB_SHA"
            echo
            echo '| Check | Result |'
            echo '| --- | --- |'
            echo "| Release installation | $RELEASE (installed: $DEPLOYED) |"
            echo "| Public HTTPS and revision | $PUBLIC |"
            echo "| Company autofill | $COMPANY |"
            echo "| GigaChat | $AI |"
            echo "| MAX authorization | $MAX |"
            echo "| Live funding source and matching | $FUNDING |"
          } >> "$GITHUB_STEP_SUMMARY"
          for check in COMPANY AI MAX FUNDING; do
            if [ "${!check}" = failure ]; then
              echo "::warning title=External integration failed::$check failed. Application installation does not mean this integration is healthy; inspect its check logs."
            fi
          done

      - name: Remove runner SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
