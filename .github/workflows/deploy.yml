name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY_B64: ${{ secrets.SERVER_SSH_KEY_B64 }}
          DADATA_API_KEY: ${{ secrets.DADATA_API_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s' "$SERVER_SSH_KEY_B64" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts

          if [ -n "$DADATA_API_KEY" ]; then
            printf 'DADATA_API_KEY=%s\n' "$DADATA_API_KEY" | ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "$SERVER_USER@$SERVER_HOST" 'umask 077; cat > /opt/app/.env.dadata; chmod 600 /opt/app/.env.dadata'
          fi

          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "$SERVER_USER@$SERVER_HOST" '
            set -e

            cd /opt/app

            git fetch origin main
            git reset --hard origin/main

            npm ci --prefix miniapp
            npm ci --prefix miniapp/api-server
            npm ci --prefix chatbot

            npm run test:production --prefix miniapp
            # Keep old hashed chunks available for already opened app sessions.
            npm run build --prefix miniapp -- --emptyOutDir false
            npm run build --prefix miniapp/api-server

            # Replace the old Vite command, not just restart its saved PM2 config.
            if pm2 describe opora-frontend >/dev/null 2>&1; then
              pm2 delete opora-frontend
            fi
            pm2 start ecosystem.config.cjs --only opora-frontend
            node miniapp/scripts/restart-api.cjs
            if pm2 describe opora-bot >/dev/null 2>&1; then
              pm2 restart opora-bot
            fi
            pm2 save

            for i in {1..15}; do
              if curl -fsS http://localhost:3000/ >/dev/null && curl -fsS http://localhost:3000/api/health && curl -fsS http://localhost:3002/api/health; then
                npm run check:production --prefix miniapp
                node miniapp/api-server/company-data/smoke-check.cjs
                node miniapp/api-server/ai/smoke-check.cjs || {
                  node miniapp/api-server/ai/check-provider.cjs
                  exit 1
                }
                exit 0
              fi
              echo "Waiting for app... $i/15"
              sleep 2
            done

            echo "Health check failed"
            pm2 status
            exit 1
          '
